packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# Only packages whose install scripts we have reviewed may run them.
# better-sqlite3 ships prebuilt binaries and needs no install script.
allowBuilds:
  esbuild: true
  # Downloads the Electron binary from GitHub releases (checksum-verified by @electron/get).
  electron: true
